<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark" style="background:#1877f2">
        <div class="container">
            <a class="navbar-brand" href="index.html">RedSocial</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="registro.html">Registro</a>
                <a class="nav-link" href="busqueda.html">Buscar personas</a>
            </div>
        </div>
    </nav>
    <div class="card tarjeta p-4">
        <h3 class="mb-1">Registro de usuario</h3>
        <p class="text-muted mb-3">Todos los campos son obligatorios.</p>

        <div id="alerta" class="alert d-none" role="alert"></div>

        <form id="formRegistro" novalidate>
            <div class="mb-2">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" maxlength="50">
            </div>
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label for="apellidoPaterno" class="form-label">Apellido paterno</label>
                    <input type="text" class="form-control" id="apellidoPaterno" maxlength="50">
                </div>
                <div class="col-md-6 mb-2">
                    <label for="apellidoMaterno" class="form-label">Apellido materno</label>
                    <input type="text" class="form-control" id="apellidoMaterno" maxlength="50">
                </div>
            </div>
            <div class="mb-2">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" maxlength="100" placeholder="ejemplo@correo.com">
            </div>
            <div class="mb-2">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" maxlength="50" placeholder="mínimo 5 caracteres">
            </div>
            <div class="mb-2">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" maxlength="100" placeholder="mínimo 8 caracteres">
            </div>
            <div class="mb-3">
                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento">
            </div>
            <button type="submit" id="btnRegistrar" class="btn btn-azul w-100">Registrar</button>
        </form>
    </div>
    <footer class="text-center pb-3">Fernando Antonio García Ruiz · 7CM1 · UPIIZ-IPN</footer>

    <script src="js/config.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
