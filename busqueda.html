<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark" style="background:#1877f2">
        <div class="container">
            <a class="navbar-brand" href="index.html">RedSocial</a>
            <div class="navbar-nav">
                <a class="nav-link" href="registro.html">Registro</a>
                <a class="nav-link active" href="busqueda.html">Buscar personas</a>
            </div>
        </div>
    </nav>
    <div class="card tarjeta p-4">
        <h3 class="mb-3">BUSCAR PERSONAS</h3>

        <form id="formBusqueda" class="d-flex gap-2" novalidate>
            <input type="search" id="texto" class="form-control" placeholder="Busca por nombre, apellido o usuario" autocomplete="off">
            <button type="submit" class="btn btn-azul px-4">BUSCAR</button>
        </form>
        <small id="ayuda" class="text-muted mt-1">Escribe al menos 3 caracteres.</small>

        <div id="alerta" class="alert alert-warning mt-3 d-none" role="alert"></div>

        <div id="contenedorResultados" class="mt-3 d-none">
            <h6 id="tituloResultados" class="text-muted">Resultados encontrados:</h6>
            <div id="resultados"></div>
        </div>
    </div>
    <footer class="text-center pb-3">Fernando Antonio García Ruiz · 7CM1 · UPIIZ-IPN</footer>

    <script src="js/config.js"></script>
    <script src="js/busqueda.js"></script>
</body>
</html>
